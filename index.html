<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCareer — Écris ta légende</title>
<style>
  :root{
    --pitch:#0B120E; --card:#131C16; --card2:#18241C;
    --line:#2C3D31; --chalk:#EDF2EA; --dim:#9BAA9E;
    --gold:#E8B84B; --gold-soft:#B98F35;
    --ok:#6FCF8E; --bad:#E06C5B; --info:#7FB6D9;
    --cond:"Roboto Condensed","Archivo Narrow","Arial Narrow",system-ui,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--pitch)}
  body{
    font-family:var(--body);color:var(--chalk);background:var(--pitch);
    min-height:100vh;line-height:1.5;
  }
  #app{max-width:460px;margin:0 auto;padding:0 14px 60px}
  .topbar{
    position:sticky;top:0;z-index:10;background:linear-gradient(var(--pitch) 82%,transparent);
    padding:10px 0 14px;display:flex;align-items:center;gap:12px;
  }
  .topbar .who{flex:1;min-width:0}
  .topbar .pname{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.4px;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .pmeta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovrbox{text-align:center;flex:none}
  .ovrbox .num{font-family:var(--cond);font-weight:700;font-size:30px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(232,184,75,.35)}
  .ovrbox .lbl{font-size:9px;letter-spacing:2px;color:var(--dim)}
  h1.logo{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;
    font-size:42px;line-height:1.05;text-wrap:balance}
  h1.logo em{font-style:normal;color:var(--gold)}
  .tagline{color:var(--dim);margin:10px 0 26px;font-size:15px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin:12px 0;position:relative;
  }
  .card.kick{border-color:var(--gold-soft)}
  .kicker{font-family:var(--cond);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--gold);margin-bottom:6px}
  .kicker.grey{color:var(--dim)}
  .card h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px;font-size:21px;
    line-height:1.15;margin-bottom:8px;text-wrap:balance}
  .card p{font-size:14.5px;color:#CBD6CC}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  button{
    font-family:var(--body);font-size:14.5px;color:var(--chalk);
    background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:11px 13px;text-align:left;cursor:pointer;width:100%;
  }
  button:hover{border-color:var(--gold-soft)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button .bl{font-weight:600;display:block}
  button .bd{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
  button.primary{background:var(--gold);color:#161206;border-color:var(--gold);
    font-family:var(--cond);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;
    text-align:center;font-size:16px}
  button.ghost{text-align:center;color:var(--dim)}
  .result{border-left:3px solid var(--line);padding:10px 12px;margin-top:12px;font-size:14px;
    background:rgba(255,255,255,.02);border-radius:0 8px 8px 0}
  .result.good{border-left-color:var(--ok)}
  .result.bad{border-left-color:var(--bad)}
  .result.gold{border-left-color:var(--gold)}
  .fx{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--cond);font-size:12px;letter-spacing:.5px;padding:2px 8px;
    border-radius:20px;border:1px solid var(--line);color:var(--dim);
    font-variant-numeric:tabular-nums}
  .chip.up{color:var(--ok);border-color:rgba(111,207,142,.4)}
  .chip.down{color:var(--bad);border-color:rgba(224,108,91,.4)}
  .chip.gold{color:var(--gold);border-color:rgba(232,184,75,.5)}
  .season-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px}
  .season-head .yr{font-family:var(--cond);font-size:26px;font-weight:700;color:var(--gold);
    font-variant-numeric:tabular-nums}
  .season-head .ag{font-size:13px;color:var(--dim)}
  table.stats{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
  table.stats td{padding:5px 2px;font-size:14px;border-bottom:1px solid rgba(44,61,49,.5)}
  table.stats td:last-child{text-align:right;font-family:var(--cond);font-size:15px}
  table.stats tr:last-child td{border-bottom:none}
  .attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:8px}
  .attr{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;
    border-bottom:1px solid rgba(44,61,49,.45)}
  .attr b{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}
  .attr .d{font-size:11px;margin-left:4px}
  .up2{color:var(--ok)} .down2{color:var(--bad)}
  .trophy{color:var(--gold);font-weight:600}
  .divider{border:none;border-top:1px dashed var(--line);margin:18px 0}
  .big-legend{font-family:var(--cond);font-size:64px;font-weight:700;color:var(--gold);
    text-align:center;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(232,184,75,.3)}
  .legend-title{font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;
    text-align:center;font-size:15px;margin-top:6px}
  .compare{margin-top:10px}
  .compare .cname{font-family:var(--cond);font-size:22px;font-weight:700;text-transform:uppercase}
  .compare .cpct{color:var(--gold);font-variant-numeric:tabular-nums}
  label{display:block;font-family:var(--cond);font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--dim);margin:14px 0 5px}
  select,input[type=text]{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--chalk);font-size:15px;font-family:var(--body)}
  .optrow{display:flex;flex-wrap:wrap;gap:6px}
  .optrow button{width:auto;flex:1 1 28%;text-align:center;font-size:13.5px;padding:9px 6px}
  .optrow button.sel{border-color:var(--gold);color:var(--gold)}
  .small{font-size:12.5px;color:var(--dim)}
  .newsline{font-size:13px;color:var(--dim);font-style:italic;margin-top:8px}
  .press{font-family:var(--cond);text-transform:uppercase;font-size:17px;letter-spacing:.5px;
    border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px;
    background:var(--card2)}
  .pantheon-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(44,61,49,.5);font-size:14px}
  .pantheon-item .sc{font-family:var(--cond);color:var(--gold);font-variant-numeric:tabular-nums;
    font-weight:700}
  .footer-note{margin-top:26px;text-align:center;font-size:12px;color:var(--dim)}
  .wiz-progress{display:flex;gap:6px;margin:18px 0 6px}
  .wiz-progress span{height:3px;flex:1;background:var(--line);border-radius:2px}
  .wiz-progress span.done{background:var(--gold)}
  .flag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .flag-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
    padding:12px 4px;font-size:13px}
  .flag-btn .fl{font-size:34px;line-height:1}
  .big-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .big-btn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    padding:22px 8px}
  .big-btn .ic{font-size:38px;line-height:1}
  .big-btn .bl{font-family:var(--cond);text-transform:uppercase;letter-spacing:1px;font-size:17px;
    font-weight:700}
  .wiz-back{margin-top:16px}
  .btn-profile{width:auto;flex:none;font-family:var(--cond);font-size:12px;letter-spacing:1px;
    text-transform:uppercase;color:var(--gold);border-color:var(--gold-soft);padding:7px 10px;
    border-radius:20px}
  .overlay{position:fixed;inset:0;background:rgba(5,9,7,.88);z-index:50;overflow-y:auto;
    padding:18px 14px 40px}
  .overlay .inner{max-width:460px;margin:0 auto}
  .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
  .bar.ok i{background:var(--ok)} .bar.bad i{background:var(--bad)}
  .staterow{margin:10px 0}
  .staterow .lbl2{display:flex;justify-content:space-between;font-size:13.5px}
  .staterow .lbl2 b{font-family:var(--cond);font-variant-numeric:tabular-nums}
  .profile-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .profile-head h2{font-size:24px}
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .25s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>

/* ================= RNG (seedable, sérialisable) ================= */
function RNG(seed){ this.s = (seed>>>0)||1; }
RNG.prototype.next = function(){
  var t = this.s += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1);
  t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0)/4294967296;
};
RNG.prototype.int=function(a,b){return a+Math.floor(this.next()*(b-a+1));};
RNG.prototype.pick=function(arr){return arr[Math.floor(this.next()*arr.length)];};
RNG.prototype.chance=function(p){return this.next()<p;};
RNG.prototype.gauss=function(){return (this.next()+this.next()+this.next())*2-3;};

/* ================= MONDE ================= */
function makeWorld(seed){
  var rng=new RNG(seed);
  var era=ERAS[Math.floor(rng.next()*ERAS.length)];
  var leagues={};
  var usedByCountry={};
  LEAGUES.forEach(function(L){
    var mult=(era.mult[L.id]||1);
    var lg={id:L.id,name:L.name,country:L.country,countryName:L.countryName,
            level:L.level,divLabel:L.divLabel,tier:L.tier,agg:L.agg,
            money:Math.min(6,L.money*mult),vis:L.vis+(mult>1?1:0),dev:L.dev,clubs:[]};
    var used=usedByCountry[L.country]=usedByCountry[L.country]||{};
    for(var i=0;i<10;i++){
      var name,guard=0;
      do{
        var city=rng.pick(L.cities),suf=rng.pick(L.suf);
        name=(suf==='Al')?('Al-'+city):(suf+' '+city);
      }while(used[name]&&guard++<60);
      used[name]=1;
      // hiérarchie retirée par seed : 1-2 cadors, un ventre mou, des petits
      var base=46+L.tier*7;
      var str=base+(i===0?9:i===1?6:i<4?3:0)+Math.round(rng.gauss()*3);
      lg.clubs.push({n:name,str:Math.max(40,Math.min(94,str)),lg:L.id});
    }
    lg.clubs.sort(function(a,b){return b.str-a.str;});
    leagues[L.id]=lg;
  });
  return {v:2,seed:seed,era:{id:era.id,name:era.name,desc:era.desc},leagues:leagues,
          rngState:rng.s,year:2026,bdoRivalBase:88+Math.round(rng.next()*4)};
}
/* Divisions d'un pays, du sommet vers le bas */
function countryDivisions(world,cid){
  var out=[];
  for(var l=1;l<=3;l++){var lid=cid+l;if(world.leagues[lid])out.push(world.leagues[lid]);}
  return out;
}
/* Tables de toute la planète + montées/descentes. influence = poids du joueur sur son club. */
function simWorldSeason(st,influence){
  var world=st.world,rng=st.rng,p=st.p;
  var tables={};
  for(var id in world.leagues){
    var L=world.leagues[id];
    tables[id]=L.clubs.map(function(c){
      var b=(id===p.lg&&c.n===p.club)?influence:0;
      return {c:c,sc:c.str+b+rng.gauss()*2.6};
    }).sort(function(a,b2){return b2.sc-a.sc;});
  }
  var moves={promoted:[],relegated:[]};
  Object.keys(COUNTRIES).forEach(function(cid){
    var divs=countryDivisions(world,cid);
    for(var i=0;i<divs.length-1;i++){
      var upper=divs[i],lower=divs[i+1];
      var down=tables[upper.id].slice(-2).map(function(x){return x.c;});
      var up=tables[lower.id].slice(0,2).map(function(x){return x.c;});
      upper.clubs=upper.clubs.filter(function(c){return down.indexOf(c)<0;});
      lower.clubs=lower.clubs.filter(function(c){return up.indexOf(c)<0;});
      up.forEach(function(c){c.lg=upper.id;c.str=Math.min(94,c.str+2);upper.clubs.push(c);
        moves.promoted.push({n:c.n,to:upper});});
      down.forEach(function(c){c.lg=lower.id;c.str=Math.max(40,c.str-2);lower.clubs.push(c);
        moves.relegated.push({n:c.n,to:lower});});
    }
  });
  // dérive douce : le monde vit
  for(var id2 in world.leagues){
    world.leagues[id2].clubs.forEach(function(c){
      c.str=Math.max(40,Math.min(94,c.str+rng.gauss()*.7));
    });
    world.leagues[id2].clubs.sort(function(a,b3){return b3.str-a.str;});
  }
  return {tables:tables,moves:moves};
}

/* ================= JOUEUR ================= */
function makePlayer(o,world,rng){
  var pos=MACROS[o.macro].pos;
  var attrs={};
  for(var k in ATTRS)attrs[k]=38+rng.int(0,8);
  var pw=POSITIONS[pos].w;
  for(var k2 in pw)attrs[k2]+=Math.round(pw[k2]*30);
  var org=ORIGINS.find(function(x){return x.id===o.origin;});
  var ent=ENTOURAGES.find(function(x){return x.id===o.ent;});
  for(var k3 in (org.fx||{}))attrs[k3]+=org.fx[k3];
  var potVar=(org.hid.potVar||0);
  var hid={
    pot:74+rng.int(0,14)+(potVar>0?rng.int(0,potVar):potVar<0?rng.int(potVar,0):0),
    pro:50+(org.hid.pro||0)+(ent.hid.pro||0)+rng.int(-8,8),
    amb:50+(ent.hid.amb||0)+rng.int(-10,10),
    ego:45+(org.hid.ego||0)+rng.int(-8,12),
    frag:50+rng.int(-15,15),
    cons:50+rng.int(-15,15),
    big:50+rng.int(-15,15),
    adapt:50+rng.int(-15,15)
  };
  hid.pot=Math.max(64,Math.min(99,hid.pot+(ent.hid.potVar||0)));
  var nat=NATIONS.find(function(n){return n.id===o.nat;});
  var lg,club;
  if(o.startClub){
    lg=world.leagues[o.startClub.lg];
    club=lg.clubs.find(function(c){return c.n===o.startClub.n;})||lg.clubs[lg.clubs.length-1];
  } else {
    var divs=countryDivisions(world,nat.id);
    lg=divs[divs.length-1]; // division la plus basse du pays par défaut
    club=lg.clubs[lg.clubs.length-1-rng.int(0,3)];
  }
  var pool=POOLS[nat.pool];
  var name=o.name&&o.name.trim()?o.name.trim():(rng.pick(pool.f)+' '+rng.pick(pool.l));
  var rivalNat=rng.pick(NATIONS);
  var rival=rng.pick(POOLS[rivalNat.pool].f)+' '+rng.pick(POOLS[rivalNat.pool].l);
  return {
    name:name,nat:o.nat,natName:nat.name,natStr:nat.str,pos:pos,macro:o.macro,style:null,
    origin:o.origin,ent:o.ent,age:15,attrs:attrs,hid:hid,
    form:50,mor:60,trust:Math.max(22,Math.min(60,60-Math.round((club.str-55)*.8))),
    rep:(org.hid.rep||0)+(ent.hid.rep||0)+2,natRep:0,
    aura:10+rng.int(0,8)+(o.origin==='filspro'?7:0),
    money:0,salary:0.02,club:club.n,clubStr:club.str,lg:lg.id,
    caps:0,natGoals:0,seenEv:[],flags:{},rival:rival,rivalLevel:70+rng.int(0,15),
    hist:[],palmares:[],moments:[],bdo:0,wcWon:0,continental:0,titles:0,cups:0,
    goals:0,assists:0,apps:0,clubsCount:1,clubsList:[club.n],abroad:false,
    injurySeasons:0,graveInjuries:0,peakOvr:0,seasonsTop:0,retired:false
  };
}
function ovr(p){
  var w=POSITIONS[p.pos].w,s=0;
  for(var k in w)s+=p.attrs[k]*w[k];
  return Math.round(s);
}
function effLevel(p){
  return ovr(p)+(p.form-50)/12+(p.mor-50)/15;
}

/* ================= SAISON ================= */
function leagueOf(st){return st.world.leagues[st.p.lg];}
function simulateSeason(st){
  var p=st.p,rng=st.rng,lg=leagueOf(st);
  var opposition=50+lg.tier*7.5;
  var lvl=effLevel(p);
  var diff=lvl-opposition;
  // temps de jeu
  var share=Math.max(.05,Math.min(1,.15+(diff+16)/38))*(.45+.55*(p.trust/100));
  if(p.age<=16)share*=.35; if(p.age===17)share*=.6;
  // blessure ?
  var inj=null;
  var pInj=(.10+p.hid.frag*.0022)*lg.agg*(p.age>30?1.3:1);
  if(rng.chance(pInj)){
    var roll=rng.next();
    if(roll<.68){inj={g:1,txt:'Blessure musculaire — quelques semaines d’absence.'};share*=.8;}
    else if(roll<.93){inj={g:2,txt:'Blessure sérieuse — plusieurs mois loin des terrains.'};share*=.5;p.form-=10;}
    else{inj={g:3,txt:'Blessure grave. Saison quasi blanche, rééducation interminable.'};share*=.18;
      p.attrs.vit=Math.max(30,p.attrs.vit-2);p.attrs.phy=Math.max(30,p.attrs.phy-2);
      p.graveInjuries++;p.flags.badInjury=1;p.flags.rehabDone=0;
      if(p.age<=21)p.hid.pot=Math.max(60,p.hid.pot-3);}
    p.injurySeasons++;
  }
  var apps=Math.round(46*share);
  // production
  var w={BU:[1,.45],AIL:[.62,.75],MO:[.5,.85],MC:[.2,.5],MDC:[.08,.22],DC:[.07,.08],LAT:[.08,.35],GB:[.004,.015]};
  var atk=(p.attrs.fin*.5+p.attrs.vit*.2+p.attrs.dri*.15+p.attrs.fra*.15);
  var crea=(p.attrs.pas*.55+p.attrs.vis*.45);
  var gpm=Math.max(.01,(atk-opposition+16)/42)*w[p.pos][0];
  var apm=Math.max(.01,(crea-opposition+14)/48)*w[p.pos][1];
  var goals=0,assists=0;
  for(var i=0;i<apps;i++){if(rng.chance(Math.min(.9,gpm)))goals++;if(rng.chance(gpm*.35))goals++;
    if(rng.chance(Math.min(.85,apm)))assists++;}
  // note moyenne
  var noise=rng.gauss()*(1.1-p.hid.cons/120);
  var gDef=POSITIONS[p.pos].g;
  var defBonus=(gDef==='DEF'||gDef==='GB')?Math.max(0,(p.clubStr-opposition))*.035+.12:0;
  var note=6.05+diff/26+goals/(apps||1)*.9+assists/(apps||1)*.6+defBonus+noise*.35;
  note=Math.max(5.2,Math.min(8.8,note));
  if(apps<8)note=Math.min(note,6.6);
  // Influence réelle du joueur sur son club — une fois titulaire (temps de jeu),
  // ses performances portent (ou plombent) l'équipe au classement.
  var influence=0;
  if(share>=.45)influence=Math.max(-4,Math.min(10,diff*.55*share*1.3));
  var worldRes=simWorldSeason(st,influence);
  var oldLgId=p.lg,oldLevel=lg.level;
  var rank=worldRes.tables[oldLgId].findIndex(function(x){return x.c.n===p.club;})+1;
  var champion=rank===1;
  var hasLower=!!st.world.leagues[lg.country+(lg.level+1)];
  var promoted=lg.level>1&&rank<=2;
  var relegated=hasLower&&rank>=9;
  // le club du joueur a peut-être changé de division : on le retrouve
  countryDivisions(st.world,lg.country).forEach(function(L2){
    L2.clubs.forEach(function(c){if(c.n===p.club){p.lg=L2.id;p.clubStr=c.str;}});
  });
  var newLg=leagueOf(st);
  /* ===== Les grands rendez-vous se jouent (pending = matchs interactifs) ===== */
  var pending=[];
  var canPlay=share>=.3&&!(inj&&inj.g===3);
  // Course au titre en Élite : le dernier match décide
  if(lg.level===1&&canPlay&&(rank===1||rank===2)){
    var other=worldRes.tables[oldLgId][rank===1?1:0].c;
    pending.push({type:'title',asLeader:rank===1,opp:other.n,oppStr:other.str});
    champion=false; // à gagner sur le terrain
  }
  // Barrage de montée (3e d'une division inférieure)
  if(lg.level>1&&canPlay&&rank===3){
    var bOpp=worldRes.tables[oldLgId][3].c;
    pending.push({type:'promo',opp:bOpp.n,oppStr:bOpp.str});
  }
  // Finale de coupe nationale
  var cup=false;
  if(canPlay&&rng.chance(Math.max(.05,(p.clubStr-48)/95)*(lg.level===1?1:.45))){
    var elite1=st.world.leagues[lg.country+'1'];
    var cOpp=elite1.clubs.filter(function(c){return c.n!==p.club;})[rng.int(0,3)];
    pending.push({type:'cup',opp:cOpp.n,oppStr:cOpp.str});
  } else if(!canPlay) cup=rng.chance(Math.max(.02,(p.clubStr-52)/220)*(lg.level===1?1:.3));
  // Finale continentale
  var continental=false;
  var euroC=EURO_C.indexOf(lg.country)>=0;
  var samC=SAM_C.indexOf(lg.country)>=0;
  var contName=euroC?'Ligue des champions':'Copa Libertadores';
  if((euroC||samC)&&lg.level===1&&st.prevRank&&st.prevRank<=3){
    if(canPlay&&rng.chance(Math.max(.06,(p.clubStr-74)/45))){
      var others=[];
      Object.keys(COUNTRIES).forEach(function(cid){
        if(cid===lg.country)return;
        if((euroC&&EURO_C.indexOf(cid)<0)||(samC&&SAM_C.indexOf(cid)<0))return;
        var L1=st.world.leagues[cid+'1'];if(L1)others.push(L1.clubs[0]);
      });
      var fOpp=others.sort(function(a,b4){return b4.str-a.str;})[rng.int(0,2)]||{n:'le géant du continent',str:90};
      pending.push({type:'cont',opp:fOpp.n,oppStr:fOpp.str,name:contName});
    } else if(!canPlay) continental=rng.chance(Math.max(.02,(p.clubStr-80)/60)*.6);
  }
  // XP & progression : matchs + entraînement (les jeunes progressent surtout au centre)
  var impMult=1+(continental?.25:0);
  var ageMult=p.age<=18?1.5:p.age<=23?1.2:p.age<=28?1:.45;
  var xpMatchs=apps*.18*(note/6.8)*impMult;
  var xpTrain=(2.5+lg.dev*.9)*(0.6+p.hid.pro/125);
  var xp=(xpMatchs+xpTrain)*ageMult;
  applyGrowth(st,xp);
  // déclin
  applyDecline(st);
  // états
  p.form=Math.round(Math.max(20,Math.min(95,50+(note-6.4)*22+rng.gauss()*4)));
  p.mor=Math.round(Math.max(15,Math.min(95,p.mor+(apps>25?4:apps>12?0:-7)+(champion?6:0)+(rank>7?-3:0))));
  p.trust=Math.round(Math.max(10,Math.min(95,p.trust+(note>7?10:note>6.6?4:-6)+(apps<10?-5:0))));
  // réputation (performances pures — les trophées comptent au bilan)
  var repGain=(note-6.3)*6*(lg.vis/5)+(goals+assists)*.16+Math.max(0,((p.aura||0)-30))*.05;
  p.rep=Math.max(0,Math.min(100,p.rep+Math.round(Math.max(-4,repGain))));
  // sélection nationale (les éliminatoires de Coupe du monde se jouent)
  var natRes=simNation(st,note,apps);
  if(natRes.wcPending)pending.push({type:'wc'});
  // salaire & argent
  var o=ovr(p);
  p.salary=Math.max(.02,Math.pow(Math.max(0,(o-52))/10,2)*(newLg.money/2.4)*.55);
  p.money+=p.salary;
  var res={apps:apps,goals:goals,assists:assists,note:note,rank:rank,champion:champion,
    cup:cup,continental:continental,contName:contName,inj:inj,bdo:false,nat:natRes,
    ovrDelta:o-st.ovrBefore,promoted:promoted,relegated:relegated,
    oldDiv:LVL_LABEL[oldLevel],newDiv:newLg.divLabel,lgName:lg.name,influence:influence,
    lvl:lvl,levelPlayed:oldLevel,pending:pending,share:share};
  st.prevRank=rank;
  return res;
}
/* Applique le résultat d'une finale jouée */
function applyFinalOutcome(st,res,m,out){
  var p=st.p;
  if(m.type==='title'){
    if(out.won){res.champion=true;}
    else{res.titleLost=true;res.rank=Math.max(res.rank,2);}
  } else if(m.type==='promo'){
    if(out.won){
      var L=leagueOf(st),upper=st.world.leagues[L.country+(L.level-1)];
      if(upper){
        L.clubs=L.clubs.filter(function(c){return c.n!==p.club;});
        var moved={n:p.club,str:Math.min(94,p.clubStr+2),lg:upper.id};
        upper.clubs.push(moved);upper.clubs.sort(function(a,b){return b.str-a.str;});
        p.lg=upper.id;p.clubStr=moved.str;
        res.promoted=true;res.newDiv=upper.divLabel;
      }
    } else res.promoLost=true;
  } else if(m.type==='cup'){
    if(out.won)res.cup=true;else res.cupLost=true;
  } else if(m.type==='cont'){
    if(out.won){res.continental=true;res.contName=m.name;}
    else{res.contLost=true;p.rep=Math.min(100,p.rep+3);}
  }
}
/* Bilan final de la saison : trophées, Ballon d'Or, historique */
function finalizeSeason(st,res){
  var p=st.p,rng=st.rng;
  var o=ovr(p);
  if(res.champion&&res.levelPlayed===1){p.titles++;p.palmares.push(st.year+' — Champion ('+res.lgName+')');}
  else if(res.promoted){p.palmares.push(st.year+' — Montée en '+res.newDiv+' avec '+p.club);
    p.moments.push(st.year+' — '+p.club+' monte en '+res.newDiv+(res.influence>3?', porté par tes performances':'')+'.');}
  if(res.relegated)p.moments.push(st.year+' — Relégation de '+p.club+' en '+res.newDiv+'. Saison noire.');
  if(res.cup){p.cups++;p.palmares.push(st.year+' — Coupe nationale');}
  if(res.continental){p.continental++;p.palmares.push(st.year+' — '+res.contName);}
  if(res.nat.wcWon){p.wcWon++;p.palmares.push(st.year+' — CHAMPION DU MONDE');
    p.rep=Math.min(100,p.rep+15);
    p.moments.push(st.year+' — Champion du monde avec '+(p.natName==='France'?'la ':'')+p.natName+'.');}
  var repTro=(res.champion?4:0)+(res.promoted?3:0)+(res.continental?8:0)+(res.cup?2:0);
  p.rep=Math.min(100,p.rep+repTro);
  p.mor=Math.min(95,p.mor+(res.champion?6:0));
  // Ballon d'Or
  var grp=POSITIONS[p.pos].g;
  if((grp!=='DEF'&&grp!=='GB')||res.note>7.4){
    var myScore=res.lvl+res.goals*.32+res.assists*.18+(res.champion?3:0)+(res.continental?7:0)+(res.nat.wcWon?8:0)+(leagueOf(st).vis-3)*2;
    var rivalScore=st.world.bdoRivalBase+rng.gauss()*2.4+(st.season%4===1?2:0);
    if(myScore>rivalScore&&o>=88){res.bdo=true;p.bdo++;p.palmares.push(st.year+' — BALLON D’OR');}
  }
  p.goals+=res.goals;p.assists+=res.assists;p.apps+=res.apps;
  if(o>p.peakOvr)p.peakOvr=o;
  if(o>=85)p.seasonsTop++;
  p.hist.push({y:st.year,club:p.club,apps:res.apps,g:res.goals,a:res.assists,note:res.note});
}
function applyGrowth(st,xp){
  var p=st.p,rng=st.rng;
  // gain d'OVR visé pour la saison, freiné à l'approche du potentiel
  var o=ovr(p);
  var ovrGain=Math.min(6,xp*.35)*(1+rng.gauss()*.15);
  var head=p.hid.pot-o;
  if(head<=0)ovrGain*=.08;
  else if(head<10)ovrGain*=Math.max(.15,head/10);
  if(ovrGain<=0)return;
  var sty=p.style?STYLES.find(function(x){return x.id===p.style;}):null;
  var wPos=POSITIONS[p.pos].w;
  var w={};for(var k in wPos)w[k]=wPos[k]||.02;
  if(sty)for(var kf in (sty.fx||{}))w[kf]=(w[kf]||.02)*sty.fx[kf];
  var tot=0;for(var k2 in w)tot+=w[k2];
  // conversion points d'attributs -> delta d'OVR réel (somme pondérée)
  var conv=0;for(var k4 in w)conv+=(wPos[k4]||0)*(w[k4]/tot);
  var G=ovrGain/Math.max(.05,conv);
  for(var k3 in w){
    var gain=G*(w[k3]/tot)*(1+rng.gauss()*.2);
    var cur=p.attrs[k3];
    if(cur>88)gain*=.5;
    p.attrs[k3]=Math.min(97,cur+gain);
  }
}
function applyDecline(st){
  var p=st.p;
  var peak={ATT:29,MIL:30,DEF:30,GB:32}[POSITIONS[p.pos].g];
  if(p.age<=peak)return;
  var over=p.age-peak;
  var mult=(1.35-p.hid.pro/120)*(1+p.graveInjuries*.18);
  p.attrs.vit=Math.max(28,p.attrs.vit-(0.8+over*.5)*mult);
  p.attrs.phy=Math.max(28,p.attrs.phy-(0.6+over*.4)*mult);
  p.attrs.dri=Math.max(28,p.attrs.dri-(0.3+over*.2)*mult);
  if(p.age<33)p.attrs.men=Math.min(96,p.attrs.men+.5);
  if(p.age<32){p.attrs.pas=Math.min(96,p.attrs.pas+.2);p.attrs.vis=Math.min(96,p.attrs.vis+.2);}
}
function simNation(st,note,apps){
  var p=st.p,rng=st.rng;
  var res={called:false,wc:false,wcWon:false,wcPending:false,txt:null};
  var natLevel=55+p.natStr*6;
  if(ovr(p)+p.rep*.25>natLevel-4&&apps>12&&p.age>=18){
    var first=p.caps===0;
    res.called=true;var c=rng.int(3,9);p.caps+=c;
    if(POSITIONS[p.pos].g==='ATT')p.natGoals+=rng.int(0,Math.round(c*.7));
    p.natRep=Math.min(100,p.natRep+6);
    if(first){res.txt='PREMIÈRE SÉLECTION avec '+(p.natName==='France'?'la ':'')+p.natName+' ! Le maillot national, enfin.';
      p.moments.push(st.year+' — Première sélection nationale.');}
  }
  var wcYear=(st.year%4===2);
  if(wcYear&&res.called){
    res.wc=true;
    // Les poules : le sort collectif. Les éliminatoires, eux, se JOUENT.
    var pAdv=[0,.28,.30,.45,.6,.72][p.natStr]||.4;
    if(rng.chance(pAdv))res.wcPending=true;
    else res.txt='Coupe du monde : élimination dès les poules. Cruel — cette fois, le sort n’a pas voulu de vous.';
  }
  return res;
}
/* ===== Coupe du monde : les éliminatoires se jouent tour par tour ===== */
var WC_ROUNDS=['Huitième de finale','Quart de finale','Demi-finale','FINALE DE LA COUPE DU MONDE'];
var WC_OPPS=['la Croatie','la Belgique','l’Uruguay','la Colombie','le Nigeria','le Mexique','le Danemark','la Pologne','la Corée du Sud','le Ghana','la Suède','l’Égypte'];
function wcRoundCfg(st,r){
  var p=st.p,rng=st.rng;
  var big=['le Brésil','la France','l’Argentine','l’Allemagne','l’Espagne','l’Angleterre','l’Italie','le Portugal'];
  var opp=(r>=2||rng.chance(.35))?rng.pick(big):rng.pick(WC_OPPS);
  var natQ=55+p.natStr*6,oppQ=62+r*6;
  return {kicker:'Coupe du monde '+st.year,title:WC_ROUNDS[r],opp:opp,n:1,
    auraGold:r===3?10:7, // la Panenka en finale de Coupe du monde = +10 AURA
    edge:(natQ-oppQ)/60+(p.hid.big-50)*.002,
    winText:'La nation exulte — encore un pas vers le rêve.',
    loseText:'Tout un pays retient ses larmes. Le rêve s’arrête ici.',club:p.natName};
}
async function playWorldCup(st,res){
  var p=st.p;
  for(var r=0;r<4;r++){
    var cfg=wcRoundCfg(st,r);
    var realClub=p.club;p.club=p.natName; // le maillot national s'affiche
    var out=await playMatch(st,cfg);
    p.club=realClub;
    if(!out.won){
      res.nat.txt='Coupe du monde : parcours stoppé en '+WC_ROUNDS[r].toLowerCase().replace('finale de la coupe du monde','finale')+'. '+
        (r>=2?'Si près du sommet…':'La marche était haute.');
      p.natRep=Math.min(100,p.natRep+r*4);
      return;
    }
  }
  res.nat.wcWon=true;
  res.nat.txt='CHAMPION DU MONDE ! Le pays entier a chaviré — et ton nom est au centre de la fête.';
}
function playWorldCupAuto(st,res){
  for(var r=0;r<4;r++){
    var cfg=wcRoundCfg(st,r);
    var out=playMatchAuto(st,cfg);
    if(!out.won){res.nat.txt='CDM : stoppé en '+WC_ROUNDS[r]+'.';return;}
  }
  res.nat.wcWon=true;
}

/* ================= OFFRES & QUESTIONS DYNAMIQUES ================= */
function genOffers(st){
  var p=st.p,rng=st.rng,offers=[];
  if(p.rep<8&&ovr(p)<62)return offers;
  var lvl=ovr(p)+p.rep*.1;
  var all=[];
  for(var id in st.world.leagues){
    var L=st.world.leagues[id];
    L.clubs.forEach(function(c){if(c.n!==p.club)all.push({c:c,L:L});});
  }
  var cands=all.filter(function(x){return Math.abs(x.c.str-lvl)<11&&(x.c.str>p.clubStr-6||x.L.money>3);});
  var n=Math.min(rng.chance(.65)?2:1,cands.length);
  for(var i=0;i<n&&cands.length;i++){
    var pick=cands.splice(rng.int(0,cands.length-1),1)[0];
    var role=pick.c.str-lvl>4?'rotation':pick.c.str-lvl>-4?'titulaire en devenir':'star attendue';
    var sal=Math.max(.05,Math.pow(Math.max(0,(ovr(p)-52))/10,2)*(pick.L.money/2.4)*.7*(1+rng.next()*.4));
    offers.push({club:pick.c.n,lg:pick.L.id,lgName:pick.L.name,div:pick.L.divLabel,str:pick.c.str,role:role,
      salary:sal,abroad:pick.L.country!==NATIONS.find(function(nn){return nn.id===p.nat;}).lg.slice(0,2)});
  }
  return offers;
}
function transferQuestion(st,offers){
  var p=st.p;
  var ch=offers.map(function(o){
    var risk=o.str-ovr(p)>3;
    return {l:'Signer : '+o.club,
      d:o.lgName+' ('+o.div+') · niveau '+o.str+' · '+o.role+' · '+o.salary.toFixed(1)+' M€/an'+(o.abroad?' · étranger':''),
      transfer:o,
      eff:{mor:6}};
  });
  ch.push({l:'Rester à '+p.club,d:'La fidélité a sa valeur. Continuer l’aventure ici.',
    eff:{trust:8,mor:2,hid:{pro:1}},res:'Le club salue ton engagement. Les supporters chantent ton nom.'});
  return {kind:'transfer',kicker:'Mercato',title:'Des offres sur la table',
    text:'Ton téléphone chauffe : ton agent a reçu des propositions concrètes.',ch:ch};
}
function applyTransfer(st,o){
  var p=st.p,rng=st.rng;
  p.club=o.club;p.clubStr=o.str;p.lg=o.lg;p.salary=o.salary;
  p.clubsCount++;p.clubsList.push(o.club);
  p.trust=o.role==='star attendue'?62:o.role==='titulaire en devenir'?50:34;
  st.prevRank=null;
  var txt='Direction '+o.club+' ('+o.lgName+') !';
  if(o.abroad){
    p.abroad=true;
    if(rng.next()*100>p.hid.adapt+18){p.form-=12;p.mor-=8;
      txt+=' L’adaptation est rugueuse : langue, vestiaire, presse — tout est à apprivoiser.';}
    else txt+=' Intégration éclair : au bout d’un mois, on jurerait que tu as toujours joué ici.';
  } else txt+=' Nouveau vestiaire, nouvelles ambitions.';
  p.moments.push(st.year+' — Transfert à '+o.club+'.');
  return txt;
}
/* ================= MATCHS INTERACTIFS =================
   Les grands rendez-vous se JOUENT : une palette d'actions par temps fort,
   sans probabilités affichées — c'est ton profil qui parle. */
var MOMENTS=[
 // Attaquants
 {g:'ATT',text:'Centre au second poteau — le ballon te revient à huit mètres du but.',ch:[

function pickMoments(st,n){
  var g=POSITIONS[st.p.pos].g;
  var pool=MOMENTS.filter(function(m){return m.g===g;});
  var out=[],idx=[];
  while(out.length<n&&idx.length<pool.length){
    var i=st.rng.int(0,pool.length-1);
    if(idx.indexOf(i)<0){idx.push(i);out.push(pool[i]);}
  }
  return out;
}
function resolveMoment(st,m,c,cfg){
  var p=st.p,pr=c.base;
  (c.stats||[]).forEach(function(a){pr+=(p.attrs[a]-62)*.006;});
  pr+=((p.aura||0)-40)*.0015; // l'aura pèse dans les grands moments
  pr=Math.max(.05,Math.min(.82,pr)); // jamais de certitude, jamais affiché
  var ok=st.rng.chance(pr);
  var chips=[];
  if(ok){
    // le geste réussi forge la compétence utilisée
    var main=(c.stats&&c.stats[0])||null;
    if(main){p.attrs[main]=Math.min(97,p.attrs[main]+1);
      chips.push({t:attrLabel(p,main)+' +1',c:'up'});}
    p.rep=Math.min(100,p.rep+1);
    if(c.gold){
      var aGain=(cfg&&cfg.auraGold)||8; // ex. Panenka en finale = +10 AURA
      p.aura=Math.min(100,(p.aura||0)+aGain);
      p.rep=Math.min(100,p.rep+6);p.mor=Math.min(95,p.mor+6);
      chips.push({t:'AURA +'+aGain,c:'gold'});
      p.moments.push(st.year+' — '+c.win.split('!')[0].trim()+' ('+((cfg&&cfg.title)||'grand match')+').');
    }
  } else {
    p.aura=Math.max(0,(p.aura||0)-(c.gold?1:0)); // l'audace ratée coûte un peu de superbe
  }
  return {ok:ok,mom:ok?c.mom:-0.6,gold:ok&&!!c.gold,chips:chips};
}
/* Joue un grand match en interactif. cfg={kicker,title,opp,edge,n} */
async function playMatch(st,cfg){
  var minutes=[];var base=15+st.rng.int(0,10);
  for(var i=0;i<cfg.n;i++)minutes.push(Math.min(90,base+Math.round(i*(70/Math.max(1,cfg.n-1))+st.rng.int(-6,6))));
  var momentum=0,gold=false;
  clearApp();mountTopbar(st);
  var aff=h('<div class="card kick" style="text-align:center"><div class="kicker">'+esc(cfg.kicker)+'</div>'+
    '<h2 style="font-size:24px">'+esc(cfg.title)+'</h2>'+
    '<p><b>'+esc(st.p.club)+'</b>  vs  <b>'+esc(cfg.opp)+'</b></p>'+
    '<p class="small">Tes choix vont décider de ce match.</p></div>');
  app.appendChild(aff);
  await waitClick(aff,'Coup d’envoi');
  var moments=pickMoments(st,cfg.n);
  for(var k=0;k<moments.length;k++){
    var m=moments[k];
    clearApp();mountTopbar(st);
    var card=h('<div class="card kick"><div class="kicker">'+esc(cfg.title)+' · '+minutes[k]+'ᵉ minute</div>'+
      '<h2>Temps fort</h2><p>'+esc(m.text)+'</p><div class="choices"></div></div>');
    app.appendChild(card);
    var box=card.querySelector('.choices');
    var c=await new Promise(function(res){
      m.ch.forEach(function(cc){
        var b=document.createElement('button');
        b.innerHTML='<span class="bl">'+esc(cc.l)+'</span><span class="bd">'+esc(cc.d)+'</span>';
        b.addEventListener('click',function(){res(cc);},{once:true});
        box.appendChild(b);
      });
    });
    box.remove();
    var out=resolveMoment(st,m,c,cfg);
    momentum+=out.mom;if(out.gold)gold=true;
    card.appendChild(h('<div class="result '+(out.gold?'gold':out.ok?'good':'bad')+'">'+esc(out.ok?c.win:c.lose)+chipsHtml(out.chips)+'</div>'));
    await waitClick(card,k<moments.length-1?'La suite du match':'Dernières minutes…');
  }
  var pWin=Math.max(.07,Math.min(.93,.5+(cfg.edge||0)+momentum*.11));
  var won=st.rng.chance(pWin);
  var sc=won?st.rng.pick(['1-0','2-1','2-0','3-1']):st.rng.pick(['0-1','1-2','0-2']);
  if(won&&gold&&st.rng.chance(.5))sc='4-2';
  clearApp();mountTopbar(st);
  var fin=h('<div class="card '+(won?'kick':'')+'" style="text-align:center"><div class="kicker">'+esc(cfg.title)+' · Coup de sifflet final</div>'+
    '<h2 style="font-size:30px">'+esc(st.p.club.split(' ').pop())+' '+sc+'</h2>'+
    '<p>'+(won?'VICTOIRE ! '+esc(cfg.winText||'Ton équipe l’a fait — et tu y es pour beaucoup.')
            :esc(cfg.loseText||'La défaite est cruelle. Ce soir, le vestiaire est un tombeau.'))+'</p></div>');
  app.appendChild(fin);
  await waitClick(fin,'Continuer');
  st.p.mor=Math.max(10,Math.min(95,st.p.mor+(won?6:-6)));
  return {won:won,gold:gold};
}
/* Résolution automatique (bots d'équilibrage) */
function playMatchAuto(st,cfg){
  var momentum=0;
  var moments=pickMoments(st,cfg.n);
  moments.forEach(function(m){
    var c=m.ch[st.rng.int(0,m.ch.length-1)];
    momentum+=resolveMoment(st,m,c,cfg).mom;
  });
  var pWin=Math.max(.07,Math.min(.93,.5+(cfg.edge||0)+momentum*.11));
  return {won:st.rng.chance(pWin),gold:false};
}

function applyIdentity(st,styleId){

  if(oldPos!==s.pos)txt+=' — tu évolueras désormais comme '+POSITIONS[s.pos].label.toLowerCase();

}

/* ================= SÉLECTION DES QUESTIONS ================= */
function phase(p){return p.age<=17?'youth':p.age<=22?'rise':p.age<=29?'prime':'decline';}
function pickLifeEvent(st,profile){
  var p=st.p,rng=st.rng;
  var pool=EVENTS.filter(function(e){
    if(p.age<e.min||p.age>e.max)return false;
    if(e.once&&p.seenEv.indexOf(e.id)>=0)return false;
    if(e.cond&&!e.cond(p))return false;
    return true;
  });
  if(!pool.length)return null;
  var weighted=[];
  pool.forEach(function(e){
    var w=10;
    if(p.seenEv.indexOf(e.id)>=0)w=2;
    if(profile.seen&&profile.seen.indexOf(e.id)>=0)w=Math.max(1,w-5); // anti-répétition inter-carrières
    for(var i=0;i<w;i++)weighted.push(e);
  });
  var e=rng.pick(weighted);
  p.seenEv.push(e.id);
  if(profile.seen){if(profile.seen.indexOf(e.id)<0)profile.seen.push(e.id);saveProfile(profile);}
  return e;
}

/* ================= EFFETS ================= */
function applyEffects(st,eff){
  if(!eff)return[];
  var p=st.p,chips=[];
  if(eff.attrs)for(var k in eff.attrs){p.attrs[k]=Math.max(25,Math.min(97,p.attrs[k]+eff.attrs[k]));
    chips.push({t:attrLabel(p,k)+(eff.attrs[k]>0?' +':' ')+eff.attrs[k],c:eff.attrs[k]>0?'up':'down'});}
  if(eff.hid)for(var k2 in eff.hid){
    if(k2==='pot')p.hid.pot=Math.max(60,Math.min(99,p.hid.pot+eff.hid[k2]));
    else p.hid[k2]=Math.max(0,Math.min(100,(p.hid[k2]||50)+eff.hid[k2]));}
  if(eff.form){p.form=Math.max(10,Math.min(95,p.form+eff.form));
    chips.push({t:'Forme '+(eff.form>0?'+':'')+eff.form,c:eff.form>0?'up':'down'});}
  if(eff.mor){p.mor=Math.max(10,Math.min(95,p.mor+eff.mor));
    chips.push({t:'Moral '+(eff.mor>0?'+':'')+eff.mor,c:eff.mor>0?'up':'down'});}
  if(eff.trust){p.trust=Math.max(5,Math.min(95,p.trust+eff.trust));
    chips.push({t:'Coach '+(eff.trust>0?'+':'')+eff.trust,c:eff.trust>0?'up':'down'});}
  if(eff.rep){p.rep=Math.max(0,Math.min(100,p.rep+eff.rep));
    chips.push({t:'Réputation '+(eff.rep>0?'+':'')+eff.rep,c:eff.rep>0?'up':'down'});}
  if(eff.money){p.money=Math.max(-5,p.money+eff.money);
    chips.push({t:(eff.money>0?'+':'')+eff.money+' M€',c:eff.money>0?'up':'down'});}
  if(eff.flags)for(var k3 in eff.flags)p.flags[k3]=eff.flags[k3];
  return chips;
}
function resolveChoice(st,choice){
  var rng=st.rng,p=st.p;
  if(choice.risk){
    var r=choice.risk;
    var pr=r.p;
    if(r.stats)r.stats.forEach(function(a){pr+=(p.attrs[a]-62)*.006;});
    pr=Math.max(.03,Math.min(.8,pr)); // plafond 80 % : aucune option sans tension
    var ok=rng.chance(pr);
    var out=ok?r.win:r.lose;
    var chips=applyEffects(st,out.eff);
    if(out.moment)p.moments.push(st.year+' — '+out.moment.charAt(0).toUpperCase()+out.moment.slice(1)+'.');
    return {text:out.res,chips:chips,good:ok,gold:!!out.gold,key:out.key||0};
  }
  var chips=applyEffects(st,choice.eff);
  return {text:choice.res||'',chips:chips,good:null,key:0};
}

/* ================= SCORE DE LÉGENDE & COMPARAISON ================= */
function legendScore(p){
  var s=0;
  s+=Math.max(0,(p.peakOvr-60))*1.35;
  s+=(p.aura||0)*.12; // l'aura fait la légende autant que les chiffres
  s+=Math.min(18,p.seasonsTop*2.2);
  s+=p.titles*2.2+p.cups*1+p.continental*4.5;
  s+=p.bdo*7+p.wcWon*8;
  s+=Math.min(10,p.goals/60);
  s+=Math.min(5,p.caps/25);
  return Math.max(1,Math.min(100,Math.round(s)));
}
function legendTitle(sc){
  if(sc>=96)return 'LE GOAT';
  if(sc>=88)return 'Légende mondiale';
  if(sc>=75)return 'Grand joueur';
  if(sc>=60)return 'International respecté';
  if(sc>=45)return 'Solide professionnel';
  if(sc>=30)return 'Honnête carrière';
  return 'Espoir déchu';
}
function compareCareer(p){
  var sc=legendScore(p);
  var g=POSITIONS[p.pos].g;
  var loyal=p.clubsCount<=2;
  var early=p.hist.length&&(function(){var best=0,bi=0;p.hist.forEach(function(h,i){if(h.note>best){best=h.note;bi=i;}});return bi<p.hist.length*.35&&p.age>=30;})();
  var late=(function(){var pre=p.hist.slice(0,Math.floor(p.hist.length/2)),post=p.hist.slice(Math.floor(p.hist.length/2));
    var m=function(a){return a.length?a.reduce(function(x,h){return x+h.note;},0)/a.length:0;};
    return m(post)>m(pre)+.4&&p.peakOvr>=78;})();
  var scored=REFS.map(function(r){
    var pts=0;
    if(r.g!==g)pts-=200;
    var dl=sc<r.leg[0]?r.leg[0]-sc:sc>r.leg[1]?sc-r.leg[1]:0;
    pts-=dl*2.2;
    var b=p.bdo,dbdo=b<r.bdo[0]?r.bdo[0]-b:b>r.bdo[1]?b-r.bdo[1]:0;
    pts-=Math.min(30,dbdo*7);
    if(r.loyal===2)pts+=loyal?14:-14; else if(r.loyal===1)pts+=loyal?7:-4; else if(r.loyal===0)pts+=p.clubsCount>=4?8:-4;
    if(r.wc)pts+=p.wcWon?12:-8;
    if(r.inj)pts+=p.graveInjuries>=(r.inj===2?2:1)?14:-10;
    if(r.late)pts+=late?16:-10;
    if(r.earlyPeak)pts+=early?14:-8;
    if(r.exile)pts+=p.clubsCount>=(r.exile===2?4:3)&&p.abroad?10:-6;
    if(r.flop)pts+=sc<35?20:-40;
    if(r.waste)pts+=(sc<60&&p.hid.pro<42)?18:-25;
    if(r.long)pts+=p.age>=37?10:-4;
    if(r.humble)pts+=(p.hid.ego<45&&g==='MIL')?10:-4;
    if(r.tourn)pts+=p.wcWon&&!p.bdo?10:-4;
    if(r.big)pts+=(p.hid.big>60)?6:0;
    if(r.reconv)pts-=6; // pas de reconversion en v0.1
    if(r.goals===2)pts+=p.goals>350?10:p.goals>200?3:-6;
    return {r:r,pts:pts};
  }).sort(function(a,b){return b.pts-a.pts;});
  var best=scored[0],second=scored[1];
  var pct=Math.max(38,Math.min(97,Math.round(82+best.pts*.55)));
  var out={main:best.r,pct:pct,second:null};
  if(second&&second.pts>-20&&second.r.g===g)out.second=second.r;
  if(best.pts<-60)out.none=true;
  return out;
}

async function askQuestion(st,q,idx,total){
  clearApp();
  mountTopbar(st);
  var card=h('<div class="card kick"><div class="kicker">'+esc(q.kicker||('Décision '+idx+'/'+total))+' · '+st.year+'</div>'+
    '<h2>'+esc(q.title)+'</h2><p>'+esc(typeof q.text==='function'?q.text(st.p):q.text)+'</p>'+
    '<div class="choices"></div></div>');
  app.appendChild(card);
  var box=card.querySelector('.choices');
  var choice=await new Promise(function(res){
    q.ch.forEach(function(c){
      var b=document.createElement('button');
      b.innerHTML='<span class="bl">'+esc(c.l)+'</span>'+(c.d?'<span class="bd">'+esc(c.d)+'</span>':'');
      b.addEventListener('click',function(){res(c);},{once:true});
      box.appendChild(b);
    });
  });
  box.remove();
  var out;
  if(choice.transfer){
    var txt=applyTransfer(st,choice.transfer);
    out={text:txt,chips:applyEffects(st,choice.eff),good:true,key:0};
  } else if(choice.identity){
    var txt2=applyIdentity(st,choice.identity);
    out={text:txt2,chips:applyEffects(st,choice.eff),good:true,key:0};
  } else out=resolveChoice(st,choice);
  var cls=out.gold?'gold':out.good===true?'good':out.good===false?'bad':'';
  card.appendChild(h('<div class="result '+cls+'">'+esc(out.text||'Noté.')+chipsHtml(out.chips)+'</div>'));
  await waitClick(card,'Continuer');
  return out;
}

/* ================= BOUCLE DE CARRIÈRE ================= */
async function runYear(st,profile){
  var p=st.p;
  st.ovrBefore=ovr(p);
  saveGame(st);
  var questions=[];
  // Identité de jeu : à 16-17 ans, question garantie
  if(!p.style&&p.age>=16)questions.push(identityQuestion(st));
  // Q1 trajectoire
  var offers=(p.age>=17)?genOffers(st):[];
  if(offers.length&&(st.rng.chance(.75)||p.trust<35))questions.push(transferQuestion(st,offers));
  // Q2 vie
  var ev=pickLifeEvent(st,profile);
  if(ev)questions.push({kind:'life',kicker:'La vie de joueur',title:ev.title,
    text:ev.text,ch:ev.ch});
  var ev2=null;
  if(questions.length<2){ev2=pickLifeEvent(st,profile);
    if(ev2)questions.push({kind:'life',kicker:'La vie de joueur',title:ev2.title,text:ev2.text,ch:ev2.ch});}
  for(var i=0;i<questions.length;i++){
    await askQuestion(st,questions[i],i+1,questions.length);
  }
  var res=simulateSeason(st);
  // Les grands rendez-vous de la saison se jouent sur le terrain
  for(var j=0;j<res.pending.length;j++){
    var m=res.pending[j];
    if(m.type==='wc'){await playWorldCup(st,res);continue;}
    var out=await playMatch(st,clubFinalCfg(st,m));
    applyFinalOutcome(st,res,m,out);
  }
  finalizeSeason(st,res);
  await seasonReport(st,res);
  p.age++;st.year++;st.season++;
}
function clubFinalCfg(st,m){
  var lg=leagueOf(st);
  var edge=(st.p.clubStr-m.oppStr)/60;
  if(m.type==='title')return {kicker:lg.name+' · dernière journée',auraGold:8,
    title:m.asLeader?'Le match du titre':'Finale de championnat',opp:m.opp,n:3,edge:edge,
    winText:'CHAMPIONS ! Le titre est à vous !',
    loseText:m.asLeader?'Le titre s’envole au dernier match. Inconsolable.':'Si près du sacre… La deuxième place a un goût de cendre.'};
  if(m.type==='promo')return {kicker:lg.name,title:'Barrage de montée',opp:m.opp,n:2,edge:edge,auraGold:6,
    winText:'LA MONTÉE ! Tout le club chavire de bonheur !',
    loseText:'La montée se refuse à vous, à un match près.'};
  if(m.type==='cup')return {kicker:'Coupe nationale',title:'FINALE de la Coupe',opp:m.opp,n:2,edge:edge,auraGold:10,
    winText:'La Coupe est à vous ! Un trophée pour l’histoire du club.',
    loseText:'Finale perdue. Les médailles d’argent pèsent une tonne.'};
  return {kicker:m.name,title:'FINALE — '+m.name,opp:m.opp,n:3,edge:edge,auraGold:9,
    winText:'SUR LE TOIT DU CONTINENT ! La plus grande soirée de l’histoire du club !',
    loseText:'La plus cruelle des défaites, au pied de la plus haute marche.'};
}
function shouldRetire(st){
  var p=st.p;

  if(p.age>=33&&ovr(p)<64)return true;
  if(p.age>=36&&ovr(p)<72)return st.rng.chance(.5);
  return false;
}

async function runCareer(st){

/* Offres de contrat jeune : clubs du pays, très rarement un cador */
function genStartOffers(world,natId,rng){
  var nat=NATIONS.find(function(n){return n.id===natId;});
  var cid=nat.lg.slice(0,2);
  var divs=countryDivisions(world,cid);
  var low=divs[divs.length-1],offers=[],used={};
  function pushClub(c,L){
    if(used[c.n])return false;
    used[c.n]=1;
    var idx=L.clubs.indexOf(c);
    var standing=idx<3?'cador':idx<7?'ventre mou':'modeste';
    var d;
    if(L.level===1&&idx<3)d='⚠️ Grand club : formation d’élite, mais concurrence féroce pour percer.';
    else if(L.level===1)d=L.name+' — le grand bain tout de suite, temps de jeu à conquérir.';
    else if(standing==='cador')d=L.name+' ('+L.divLabel+') — un club ambitieux qui vise la montée.';
    else d=L.name+' ('+L.divLabel+') — club '+standing+', temps de jeu quasi garanti pour un jeune.';
    offers.push({n:c.n,lg:L.id,desc:d,div:L.divLabel});
    return true;
  }
  var guard=0;
  while(offers.length<3&&guard++<50){
    var r=rng.next();
    if(r<.04&&divs[0].level===1){ // le rêve : un cador de l'Élite (très rare)
      pushClub(rng.pick(divs[0].clubs.slice(0,3)),divs[0]);
    } else if(r<.18&&divs.length>1){ // milieu/bas d'Élite
      pushClub(rng.pick(divs[0].clubs.slice(4)),divs[0]);
    } else if(divs.length>2&&r<.5){ // division intermédiaire
      pushClub(rng.pick(divs[1].clubs.slice(3)),divs[1]);
    } else { // bas de la pyramide (le départ normal)
      pushClub(rng.pick(low.clubs.slice(3)),low);
    }
  }
  return offers;
}

/* ================= TEST AUTOMATIQUE (débogage/équilibrage) ================= */
window.__sim=function(n){
  n=n||30;
  var out={careers:[],avgLegend:0,maxLegend:0,bdoTotal:0,titles:0,errors:0};
  for(var i=0;i<n;i++){
    try{
      var seed=(123456+i*7919)>>>0;
      var world=makeWorld(seed);
      var rng=new RNG(seed^0x9E3779B9);
      var natIds=NATIONS.map(function(x){return x.id;});
      var macros=Object.keys(MACROS);
      var o={nat:natIds[i%natIds.length],macro:macros[i%4],
        origin:ORIGINS[i%4].id,ent:ENTOURAGES[i%4].id,name:''};
      var p=makePlayer(o,world,rng);
      var st={world:world,p:p,year:world.year,season:1,prevRank:null,ovrBefore:ovr(p),rng:rng};
      var profile={seen:[],pantheon:[]};
      var guard=0;
      while(!shouldRetire(st)&&guard++<40){
        st.ovrBefore=ovr(p);
        if(!p.style&&p.age>=16){
          var sts=STYLES.filter(function(s){return s.macro===p.macro;});
          applyIdentity(st,sts[st.rng.int(0,sts.length-1)].id);
        }
        var offers=(p.age>=17)?genOffers(st):[];
        if(offers.length&&st.rng.chance(.6)){
          var q=transferQuestion(st,offers);
          var c=q.ch[st.rng.int(0,q.ch.length-1)];
          if(c.transfer)applyTransfer(st,c.transfer);else applyEffects(st,c.eff);
        }
        var ev=pickLifeEvent(st,profile);
        if(ev){var cc=ev.ch[st.rng.int(0,ev.ch.length-1)];resolveChoice(st,cc);}
        var res=simulateSeason(st);
        for(var pi=0;pi<res.pending.length;pi++){
          var pm=res.pending[pi];
          if(pm.type==='wc'){playWorldCupAuto(st,res);continue;}
          applyFinalOutcome(st,res,pm,playMatchAuto(st,clubFinalCfg(st,pm)));
        }
        finalizeSeason(st,res);
        p.age++;st.year++;st.season++;
      }
      var sc=legendScore(p);
      var cmp=compareCareer(p);
      out.careers.push({name:p.name,pos:p.pos,peak:p.peakOvr,legend:sc,bdo:p.bdo,
        titles:p.titles,goals:p.goals,clubs:p.clubsCount,cmp:cmp.none?'—':cmp.main.n,pct:cmp.pct});
      out.avgLegend+=sc;out.maxLegend=Math.max(out.maxLegend,sc);
      out.bdoTotal+=p.bdo;out.titles+=p.titles;
    }catch(e){out.errors++;out.lastError=String(e&&e.stack||e);}
  }
  out.avgLegend=Math.round(out.avgLegend/n);
  return out;
};
